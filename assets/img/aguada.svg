<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="presentation" aria-hidden="true">
  <defs>
    <filter id="acuarela" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="4" seed="7" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="70" xChannelSelector="R" yChannelSelector="G" result="desplazado"/>
      <feGaussianBlur in="desplazado" stdDeviation="14"/>
    </filter>
    <filter id="acuarela2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.014" numOctaves="3" seed="19" result="ruido"/>
      <feDisplacementMap in="SourceGraphic" in2="ruido" scale="55" xChannelSelector="R" yChannelSelector="B" result="desplazado"/>
      <feGaussianBlur in="desplazado" stdDeviation="10"/>
    </filter>
    <radialGradient id="g-verde" cx="42%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#7eb0a5" stop-opacity=".85"/>
      <stop offset="70%" stop-color="#c8ceb9" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#c8ceb9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-lila" cx="55%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#abaac1" stop-opacity=".7"/>
      <stop offset="65%" stop-color="#e0d0d9" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#e0d0d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-azul" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#7189bb" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#6c87c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-rosa" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e0bdb2" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#e0bdb2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g filter="url(#acuarela)">
    <ellipse cx="330" cy="300" rx="250" ry="215" fill="url(#g-verde)"/>
    <ellipse cx="520" cy="230" rx="200" ry="180" fill="url(#g-lila)"/>
  </g>
  <g filter="url(#acuarela2)">
    <ellipse cx="470" cy="400" rx="190" ry="150" fill="url(#g-azul)"/>
    <ellipse cx="250" cy="430" rx="150" ry="120" fill="url(#g-rosa)"/>
  </g>
</svg>
